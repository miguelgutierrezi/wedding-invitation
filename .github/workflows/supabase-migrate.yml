# Applies pending SQL under supabase/migrations/ to the linked Supabase project.
#
# Runs only when migration files change on main (or via manual dispatch).
# Quality checks (lint/typecheck/build) live in ci.yml and run on every push/PR.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — Account → Access Tokens
#   SUPABASE_PROJECT_REF   — Project Settings → General → Reference ID
#   SUPABASE_DB_PASSWORD   — Project Settings → Database → database password
#
# Does not seed data. Does not deploy the Next.js app (Vercel does that).

name: Supabase migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      - name: Show migration status
        run: supabase migration list
